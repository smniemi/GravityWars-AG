<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <!-- PWA / Fullscreen Mode -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />

  <title>GravityWars Web</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #020205;
      font-family: 'Galactican', system-ui, sans-serif;
      color: #fefefe;
    }

    #app {
      width: 100%;
      height: 100%;
      /* Prevent text selection and touch behaviors */
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
  </style>
  <script type="module" crossorigin src="./assets/index-BArqi5uX.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-B9RVCg4g.css">
</head>

<body>
  <div id="loading-overlay">
    <div class="loader"></div>
    <div id="loading-text" class="loading-text">INITIALIZING SYSTEMS...</div>
  </div>
  <div id="app"></div>
  <script>
    // Fun Loading Messages
    const messages = [
      "CALIBRATING GRAVITY SENSORS...",
      "FUELING THRUSTERS...",
      "LOADING STAR MAPS...",
      "ESTABLISHING NEURAL LINK...",
      "WARMING UP ENGINES...",
      "SCANNING FOR HOSTILES...",
      "GENERATING TERRAIN...",
      "SYNCHRONIZING ORBITS..."
    ];
    let msgIndex = 0;
    const textEl = document.getElementById('loading-text');
    if (textEl) {
      setInterval(() => {
        msgIndex = (msgIndex + 1) % messages.length;
        textEl.innerText = messages[msgIndex];
      }, 800);
    }

    // Mobile Debug Error Handler
    window.addEventListener('error', function (event) {
      const overlay = document.getElementById('loading-overlay');
      if (overlay) {
        const errDiv = document.createElement('div');
        errDiv.style.color = '#f33';
        errDiv.style.marginTop = '20px';
        errDiv.style.padding = '10px';
        errDiv.style.textAlign = 'center';
        errDiv.style.fontFamily = 'monospace';
        errDiv.innerText = 'ERROR: ' + event.message;
        overlay.appendChild(errDiv);
      }
      console.error(event.error);
    });
    window.addEventListener('unhandledrejection', function (event) {
      const overlay = document.getElementById('loading-overlay');
      if (overlay) {
        const errDiv = document.createElement('div');
        errDiv.style.color = '#f33';
        errDiv.style.marginTop = '20px';
        errDiv.style.padding = '10px';
        errDiv.style.textAlign = 'center';
        errDiv.style.fontFamily = 'monospace';
        errDiv.innerText = 'PROMISE ERROR: ' + (event.reason ? event.reason.message || event.reason : 'Unknown');
        overlay.appendChild(errDiv);
      }
    });
  </script>
</body>

</html>
